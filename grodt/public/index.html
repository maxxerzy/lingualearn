<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GRODT — Märkte, Charts & Alarme</title>
  <meta name="description" content="GRODT: Kurse, Kerzencharts, Fundamentaldaten, News, Watchlist mit Alarmen und Paper-Trading-Depot — für iPhone und Mac.">
  <meta name="theme-color" content="#101418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GRODT">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div id="app">
    <header id="appHeader">
      <a class="brand" href="#/maerkte" aria-label="GRODT Start">
        <img src="icons/icon-192.png" alt="" width="28" height="28">
        <span>GRODT</span>
      </a>
      <div class="header-actions">
        <span id="liveDot" class="live-dot" title="Datenverbindung" hidden></span>
        <button id="searchBtn" class="icon-btn" aria-label="Suche öffnen" title="Aktie suchen (⌘K)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line>
          </svg>
        </button>
      </div>
    </header>

    <nav id="mainNav" aria-label="Hauptnavigation"></nav>

    <main id="view" tabindex="-1"></main>

    <div id="modalRoot"></div>
    <div id="toastRoot" aria-live="polite"></div>
  </div>

  <noscript>GRODT benötigt JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
